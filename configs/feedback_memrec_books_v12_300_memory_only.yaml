# Standalone resolved configuration; no external YAML inheritance required.
model: memrec_agent
dataset: instructrec-books
seed: 45
n_eval_candidates: 10
n_eval_users: 300
eval_user_list: data/eval_user_samples/strict_books_v12_300_seed45.json
topk:
- 1
- 3
- 5
- 10
metrics:
- Hit
- NDCG
eval_feedback: gt
warmup:
  enabled: true
  rounds: 1
provider:
  name: openai
  model: Qwen2.5-7B-Instruct
  endpoint: http://127.0.0.1:8001/v1
  api_key: local-vllm
reranker_provider:
  name: openai
  model: Qwen2.5-7B-Instruct
  endpoint: http://127.0.0.1:8001/v1
  api_key: local-vllm
memrec:
  k: 16
  tau_tokens: 1800
  mix_min_users: 4
  mix_min_items: 6
  n_facets: 7
  temperature: 0.0
  max_tokens: 2400
  pruner:
    mode: llm_rules
    checkpoint: null
  reranker_mode: llm
  write:
    fanout_cap: 8
    max_tokens: 2400
feedback_credit:
  enabled: false
  learn_credit: false
  freeze_credit: true
  learning_rate: 0.2
  episode_delta_clip: 0.5
read_credit:
  enabled: false
  lambda_credit: 0.5
  min_multiplier: 0.5
  max_multiplier: 1.5
write_gate:
  enabled: false
  use_current_episode_delta: false
  min_credit_observations: 2
  threshold: -0.3
attribution:
  enabled: false
  method: per_facet_leave_one_out
  reward: single_positive_ndcg_at_10
debug: false
experiment_name: feedback_memrec_v12_continuous_300_memory_only
evaluation_block: v12_continuous_300
persist_memory_after_warmup: true
neighbor_memory_read:
  enabled: true
  max_user_neighbors: 4
  max_item_neighbors: 4
  per_memory_tokens: 64
  total_memory_tokens: 512
  preserve_static_neighbors: true
  truncation: head_tail
  head_tokens: 40
  tail_tokens: 24
  persist_events: true
  persist_packed_context: true
  tokenizer_path: models/Qwen2.5-7B-Instruct
